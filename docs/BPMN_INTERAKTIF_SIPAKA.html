<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPMN 2.0 Diagram Interaktif — SIPAKA (LexVera)</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background-color: #273549;
      color: var(--text);
    }
    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .content-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action:hover {
      border-color: var(--primary);
      color: #ffffff;
    }
    .btn-action.copied {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .diagram-container {
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      min-height: 450px;
    }
    .desc-box {
      margin-top: 20px;
      padding: 16px;
      background-color: #172033;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .desc-box h4 {
      color: #93c5fd;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .desc-box ul {
      margin-left: 20px;
      margin-top: 6px;
    }
    .desc-box li {
      margin-bottom: 4px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--accent);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 99;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏛️ SIPAKA (LexVera) — Dokumentasi Diagram BPMN 2.0</h1>
    <p>Visualisasi proses bisnis, alur data hukum real-time, kurasi ISO 7.5.3, dan mesin konsolidasi deterministik.</p>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(0)">1. Ingesti Data & Parsing AST</button>
    <button class="tab-btn" onclick="switchTab(1)">2. Kurasi & Quality Gate (ISO 7.5.3)</button>
    <button class="tab-btn" onclick="switchTab(2)">3. Mesin Rekonstruksi Deterministik</button>
    <button class="tab-btn" onclick="switchTab(3)">4. Interaksi Peneliti & Visual Diff</button>
  </div>

  <div class="content-card">
    <div class="card-top">
      <div class="card-title" id="tabTitle">BPMN 1: Pipeline Ingesti Data Regulasi & Parsing AST Otomatis</div>
      <div class="actions">
        <button class="btn-action" onclick="copyMermaidCode()">📋 Salin Kode Mermaid</button>
        <button class="btn-action" onclick="openMermaidLive()">🌐 Buka di Mermaid Live Editor</button>
      </div>
    </div>

    <div class="diagram-container">
      <div class="mermaid" id="mermaidTarget"></div>
    </div>

    <div class="desc-box" id="tabDescription"></div>
  </div>

  <div class="toast" id="toast">Kode Mermaid berhasil disalin ke clipboard!</div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0b1120',
        primaryColor: '#1e3a8a',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#3b82f6',
        lineColor: '#60a5fa',
        secondaryColor: '#064e3b',
        tertiaryColor: '#1e293b'
      }
    });

    const bpmnData = [
      {
        title: "BPMN 1: Pipeline Ingesti Data Regulasi & Parsing AST Otomatis",
        code: `flowchart TD
    StartCron(["Timer Event: Scheduler Tiap 1-3 Jam"]) --> FetchIndex["Service Task: Ambil Katalog & Metadata JDIHN / Setneg"]
    FetchIndex --> CheckDup{"Exclusive Gateway: Regulasi Sudah Ada di DB?"}
    
    CheckDup -- "Ya (Duplikat)" --> EndSkip(["End Event: Skip & Catat Log"])
    CheckDup -- "Belum Ada" --> DownloadPDF["Service Task: Unduh PDF Resmi"]
    
    DownloadPDF --> ForkIngest{"Parallel Gateway (+)"}
    
    ForkIngest --> HashStore["Service Task: Hitung SHA-256 Checksum & Simpan ke MinIO Storage"]
    ForkIngest --> LayoutExtract["Service Task: Ekstraksi Teks & Indentasi (PyMuPDF / OCR)"]
    
    HashStore --> JoinIngest{"Parallel Gateway (+)"}
    LayoutExtract --> JoinIngest
    
    JoinIngest --> ASTParse["Service Task: Structural Parser (Bab, Bagian, Pasal, Ayat, Huruf)"]
    ASTParse --> EvalScore["Business Rule Task: Hitung Skor Kepatuhan & Sekuensial Pasal"]
    
    EvalScore --> ScoreCheck{"Exclusive Gateway: Skor Parser >= 70 & Tanpa Ambiguitas?"}
    
    ScoreCheck -- "Gagal / Anomali" --> QuarantineState["Service Task: Masukkan ke Tabel Karantina (Status: QUARANTINED)"]
    QuarantineState --> AlertAdmin["Service Task: Kirim Notifikasi Anomali ke Dashboard Admin"]
    AlertAdmin --> EndQuarantine(["End Event: Menunggu Intervensi Manual"])
    
    ScoreCheck -- "Lolos" --> ClassifyOp["Service Task: Klasifikasi Operasi Amandemen (ADD, REPLACE, REPEAL)"]
    ClassifyOp --> CreateDraft["Service Task: Tulis ke Database (ChangeSet Status: DRAFT_IN_REVIEW)"]
    CreateDraft --> EndDraftReady(["End Event: Draf Amandemen Siap Dikurasi"])`,
        description: `<h4>Penjelasan Alur Proses (BPMN 1):</h4>
        <ul>
          <li><strong>Otomatisasi Penuh:</strong> Cron worker memantau portal JDIH Setneg & JDIHN Kemenkumham setiap 1-3 jam.</li>
          <li><strong>Prinsip Two-Store:</strong> File PDF asli disimpan permanen di MinIO dengan verifikasi hash SHA-256 (bukti hukum otentik tak terubahkan).</li>
          <li><strong>Quality Gateway:</strong> Aturan fail-closed memeriksa kelengkapan struktur (skor &ge; 70). Jika ada pasal rusak atau terpotong, naskah dikarantina otomatis.</li>
        </ul>`
      },
      {
        title: "BPMN 2: Kurasi Human-in-the-Loop & Approval Gate (ISO 7.5.3)",
        code: `flowchart TD
    StartReview(["Start Event: Kurator Membuka Menu Persetujuan Naskah"]) --> LoadInspector["User Task: Inspeksi Naskah Side-by-Side (PDF Asli vs AST Draf)"]
    LoadInspector --> ValidateOperation["User Task: Uji Operasi Pasal (ADD / REPLACE / REPEAL / Sisipan)"]
    
    ValidateOperation --> DecisionGateway{"Exclusive Gateway: Keputusan Kurator Hukum"}
    
    DecisionGateway -- "Ada Ketidaksesuaian Ringan" --> ManualEdit["User Task: Koreksi Formulasi Teks / Posisi Node di Editor"]
    ManualEdit --> ValidateOperation
    
    DecisionGateway -- "Cacat Naskah / Format Rusak" --> RejectAction["User Task: Tolak Naskah & Tulis Alasan Penolakan"]
    RejectAction --> ArchiveRejected["Service Task: Ubah Status Draf ke REJECTED & Arsipkan Jejak"]
    ArchiveRejected --> EndRejected(["End Event: Draf Ditolak"])
    
    DecisionGateway -- "Valid & Sesuai 100%" --> SignApproval["User Task: Beri Tanda Tangan Verifikasi & Catatan Review"]
    SignApproval --> AuditLogEntry["Service Task: Catat Auditor, Timestamp, & Hash ke review_records"]
    AuditLogEntry --> PromotePublished["Service Task: Mutasi Status ChangeSet menjadi PUBLISHED"]
    PromotePublished --> InvalidateCache["Service Task: Invalidate Redis Cache & Picu Build Index"]
    InvalidateCache --> EndApproved(["End Event: Peraturan Resmi Aktif & Tersedia"])`,
        description: `<h4>Penjelasan Alur Proses (BPMN 2):</h4>
        <ul>
          <li><strong>Kepatuhan ISO 9001 (Klausul 7.5.3):</strong> Tidak ada naskah regulasi yang terbit tanpa kurasi manusia.</li>
          <li><strong>Immutable Audit Trail:</strong> Setiap persetujuan merekam ID kurator, hash naskah, waktu tanda tangan, dan catatan yuridis ke tabel <code>review_records</code>.</li>
          <li><strong>Integritas Sisipan:</strong> Kurator memvalidasi nomor fraksional pasal (misalnya Pasal 27A &rarr; orderIndex 27.1) agar konsisten tanpa renumbering.</li>
        </ul>`
      },
      {
        title: "BPMN 3: Mesin Rekonstruksi Konsolidasi Deterministik (Point-in-Time)",
        code: `flowchart LR
    StartQuery(["Start Event: Request Naskah (slug, Target Date)"]) --> CheckCache{"Exclusive Gateway: Snapshot Tersedia di Redis?"}
    
    CheckCache -- "Hit (Ada)" --> ServeCache["Service Task: Ambil Snapshot Terkompresi"]
    ServeCache --> ReturnResponse(["End Event: Kirim JSON Naskah"])
    
    CheckCache -- "Miss (Belum)" --> FetchBase["Service Task: Ambil Pohon Regulasi Induk dari Database"]
    FetchBase --> FetchOps["Service Task: Kueri Seluruh ChangeOperation Efektif <= Target Date"]
    
    FetchOps --> LoopOps["Sub-Process: Iterasi Rantai Operasi Kronologis (Ascending)"]
    
    subgraph LoopOps [Eksekusi Mutasi Deterministik]
        ApplyAdd["Operasi ADD: Sisipkan Node Baru pada Posisi Fraksional"]
        ApplyReplace["Operasi REPLACE: Mutasi Teks Pasal & Arsipkan Versi Lama"]
        ApplyRepeal["Operasi REPEAL: Beri Flag Dicabut & Nonaktifkan Kekuatan Mengikat"]
        ApplyMK["Operasi BERSYARAT_MK: Tempelkan Anotasi Hermeneutika Putusan MK"]
    end
    
    LoopOps --> BuildTree["Service Task: Rekonstruksi Pohon Konsolidasi Final"]
    BuildTree --> SaveCache["Service Task: Simpan Snapshot Hasil Rekonstruksi ke Cache"]
    SaveCache --> ReturnResponse`,
        description: `<h4>Penjelasan Alur Proses (BPMN 3):</h4>
        <ul>
          <li><strong>Deterministik & Reversible:</strong> Konsolidasi tidak disimpan statis, melainkan dirakit secara dinamis berdasarkan urutan operasi yuridis (ADD, REPLACE, REPEAL, PARTIAL_REPEAL).</li>
          <li><strong>Point-in-Time Reconstruction:</strong> Peneliti dapat melihat kondisi sah pasal pada tanggal spesifik di masa lalu (misal: kondisi UU ITE tanggal 15 Agustus 2018).</li>
          <li><strong>Anotasi Mahkamah Konstitusi:</strong> Putusan pengujian UU langsung ditempelkan pada ayat yang bersangkutan tanpa menghapus teks undang-undang aslinya.</li>
        </ul>`
      },
      {
        title: "BPMN 4: Interaksi Peneliti Hukum & Visual Diff Inspector",
        code: `flowchart TD
    StartUser(["Start Event: Peneliti Mengakses Platform SIPAKA"]) --> SearchCatalog["User Task: Cari Regulasi via Kata Kunci / Nomor / Judul"]
    SearchCatalog --> SelectFamily["User Task: Pilih Keluarga Peraturan (Misal: Keluarga UU ITE)"]
    
    SelectFamily --> ViewReader["Service Task: Muat Reader Naskah Terkini"]
    ViewReader --> UserOption{"Exclusive Gateway: Aksi Peneliti Selanjutnya"}
    
    UserOption -- "Eksplorasi Linimasa" --> SelectDate["User Task: Geser Slider Linimasa ke Titik Tahun Tertentu (Misal: 2016)"]
    SelectDate --> TriggerPIT["Service Task: Request Rekonstruksi Point-in-Time ke API"]
    TriggerPIT --> ViewReader
    
    UserOption -- "Inspeksi Perubahan (Diff)" --> SelectVersions["User Task: Pilih 2 Versi untuk Dikomparasi (Tahun A vs Tahun B)"]
    SelectVersions --> ExecDiff["Service Task: Hitung Diff LCS Kata-per-Kata (LegalDiffGenerator)"]
    ExecDiff --> RenderSideBySide["User Task: Tampilkan Layar Komparasi Side-by-Side (Merah = Hapus, Hijau = Sisipan)"]
    RenderSideBySide --> InspectRationale["User Task: Buka Silsilah Perubahan & Catatan Risalah DPR / Naskah Akademik"]
    InspectRationale --> EndResearch(["End Event: Selesai / Ekspor Sitasi Hukum"])
    
    UserOption -- "Uji Otentisitas" --> ViewOriginal["User Task: Klik Tombol 'Dokumen Asli'"]
    ViewOriginal --> ServePDFStream["Service Task: Alirkan PDF Asli MinIO + Tampilkan SHA-256 + Tautan JDIHN"]
    ServePDFStream --> EndResearch`,
        description: `<h4>Penjelasan Alur Proses (BPMN 4):</h4>
        <ul>
          <li><strong>Visual Diff Kata-per-Kata:</strong> Algoritma LCS (Longest Common Subsequence) membandingkan perbedaan teks pasal lama vs baru secara presisi warna.</li>
          <li><strong>Provenance Verifiable:</strong> Peneliti dapat mengklik satu tombol untuk melihat PDF asli lembaran negara dan mencocokkan checksum SHA-256.</li>
        </ul>`
      }
    ];

    let currentTabIndex = 0;

    function renderDiagram(index) {
      currentTabIndex = index;
      const target = document.getElementById('mermaidTarget');
      document.getElementById('tabTitle').innerText = bpmnData[index].title;
      document.getElementById('tabDescription').innerHTML = bpmnData[index].description;
      
      target.removeAttribute('data-processed');
      target.innerHTML = bpmnData[index].code;
      mermaid.init(undefined, target);
    }

    function switchTab(index) {
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach((b, i) => {
        if (i === index) b.classList.add('active');
        else b.classList.remove('active');
      });
      renderDiagram(index);
    }

    function copyMermaidCode() {
      const code = bpmnData[currentTabIndex].code;
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      });
    }

    function openMermaidLive() {
      const code = bpmnData[currentTabIndex].code;
      const state = {
        code: code,
        mermaid: { theme: 'dark' }
      };
      const jsonStr = JSON.stringify(state);
      const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
      window.open('https://mermaid.live/edit#' + base64, '_blank');
    }

    // Initial render
    window.onload = function() {
      renderDiagram(0);
    };
  </script>
</body>
</html>
