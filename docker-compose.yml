services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexvera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexvera_admin
      POSTGRES_PASSWORD: lexvera_secure_pass_2026
      POSTGRES_DB: lexvera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexvera_admin -d lexvera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
